version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: vulnapp
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vulnapp
    ports:
      - "5432:5432"
    volumes:
      - ./infra:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnapp"]
      interval: 5s
      timeout: 5s
      retries: 5
